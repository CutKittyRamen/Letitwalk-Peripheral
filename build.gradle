plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.squiddev.cc" }
    maven { url = "https://maven.ryanhcode.dev/releases" }
}

dependencies {
    implementation 'org.jspecify:jspecify:1.0.0'

    // Create & Ponder
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+62")

    // CC: Tweaked
    implementation "cc.tweaked:cc-tweaked-1.21.1-forge:1.120.2"

    // Sable & Sable Companion
    implementation "curse.maven:sable-1312371:9043865"
    implementation "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0"

    // Let It Walk
    implementation "curse.maven:let-it-walk-1780503:9493262"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
